name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: shellcheck --shell=sh install.sh uninstall.sh claude-rc-run
      - name: Validate the systemd unit template
        run: |
          sed -e 's|@USER@|svcuser|g' -e 's|@HOME@|/home/svcuser|g' \
              -e 's|@WORKDIR@|/home/svcuser/work|g' \
              claude-rc.service.in > /tmp/claude-rc.service
          systemd-analyze verify /tmp/claude-rc.service
