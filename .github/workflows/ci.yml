name: CI

# Two stable job ids, meant to be the required status checks: `shellcheck` and
# `test`. There is deliberately NO workflow-level `paths:` filter (convention C1):
# a required check whose workflow does not start is reported as pending forever,
# not as skipped.
#
# Public repo => GitHub-hosted `ubuntu-latest` (free). Never a self-hosted runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck is preinstalled on ubuntu-latest.
      - name: Lint shell scripts
        run: shellcheck --shell=sh install.sh uninstall.sh claude-rc-run tests/*.sh
      - name: Validate the systemd unit template
        # systemd-analyze also resolves User= and ExecStart=, so the service
        # user and the wrapper have to exist for the check to say anything
        # beyond "syntax parses".
        run: |
          sudo useradd --create-home --shell /bin/bash svcuser
          sudo install -d -o svcuser -g svcuser /home/svcuser/work
          sudo install -m 0755 claude-rc-run /usr/local/bin/claude-rc-run
          sed -e 's|@USER@|svcuser|g' -e 's|@HOME@|/home/svcuser|g' \
              -e 's|@WORKDIR@|/home/svcuser/work|g' \
              claude-rc.service.in > /tmp/claude-rc.service
          systemd-analyze verify /tmp/claude-rc.service

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wrapper runs against a stub `claude` and `script`; install.sh and
      # uninstall.sh only ever run with --destdir into a temp dir. No network, no
      # systemd, no user is created, nothing outside a temp dir is touched.
      - name: Run tests
        run: sh tests/run-all.sh
